<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>粘液科技助手 - 工作站配置管理器</title>

    <!-- Tailwind CSS -->
    <script src="js/lib/tailwindcss.min.js"></script>
    <script src="js/lib/tailwind.config.js"></script>

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-bold text-gray-900">工作站配置管理器</h1>
            <p class="text-sm text-gray-500 mt-1">粘液科技助手配置工具</p>
          </div>
          <div class="flex gap-2">
            <button
              id="importBtn"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
            >
              导入配置
            </button>
            <button
              id="exportBtn"
              class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
            >
              导出配置
            </button>
            <button
              id="addBtn"
              class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors"
            >
              + 添加工作站
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <!-- 搜索和过滤工具栏 -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
        <div class="flex flex-wrap gap-4">
          <div class="flex-1 min-w-[200px]">
            <input
              type="text"
              id="searchInput"
              placeholder="搜索ID或名称..."
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>
          <div class="min-w-[150px]">
            <select
              id="typeFilter"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
              <option value="">全部类型</option>
              <option value="single">单方块</option>
              <option value="multi">多方块</option>
            </select>
          </div>
          <div class="min-w-[150px]">
            <select
              id="sortBy"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
              <option value="priority">按优先级</option>
              <option value="id">按ID</option>
              <option value="name">按名称</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 工作站列表 -->
      <div id="workstationList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- 工作站卡片将通过JS动态生成 -->
      </div>
    </main>

    <!-- 编辑模态框 -->
    <div
      id="editModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
        <div
          class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between"
        >
          <h2 id="modalTitle" class="text-xl font-bold text-gray-900">编辑工作站</h2>
          <button id="closeModal" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
        <div id="modalContent" class="p-6">
          <!-- 模态框内容将通过JS动态生成 -->
        </div>
      </div>
    </div>

    <!-- JSON预览模态框 -->
    <div
      id="jsonModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
        <div
          class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between"
        >
          <h2 class="text-xl font-bold text-gray-900">JSON预览</h2>
          <button id="closeJsonModal" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
        <div class="p-6">
          <pre id="jsonPreview" class="bg-gray-50 p-4 rounded-lg overflow-x-auto text-sm"></pre>
          <div class="mt-4 flex gap-2">
            <button
              id="downloadJson"
              class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
            >
              下载JSON
            </button>
            <button
              id="copyJson"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
            >
              复制到剪贴板
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="fileInput" accept=".json" class="hidden" />

    <!-- Toast提示容器 -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[60] flex flex-col gap-2"></div>

    <!-- 确认对话框 -->
    <div
      id="confirmModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
        <h3 id="confirmTitle" class="text-lg font-bold text-gray-900 mb-4">确认操作</h3>
        <p id="confirmMessage" class="text-gray-600 mb-6"></p>
        <div class="flex gap-3 justify-end">
          <button
            id="confirmCancel"
            class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors"
          >
            取消
          </button>
          <button
            id="confirmOk"
            class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
          >
            确定
          </button>
        </div>
      </div>
    </div>

    <!-- 输入对话框 -->
    <div
      id="promptModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
        <h3 id="promptTitle" class="text-lg font-bold text-gray-900 mb-4">输入信息</h3>
        <input
          type="text"
          id="promptInput"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-6"
        />
        <div class="flex gap-3 justify-end">
          <button
            id="promptCancel"
            class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors"
          >
            取消
          </button>
          <button
            id="promptOk"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
          >
            确定
          </button>
        </div>
      </div>
    </div>

    <!-- 外部库 -->
    <script src="js/lib/zepto.min.js"></script>

    <!-- 工具函数 -->
    <script src="js/utils/validator.js"></script>
    <script src="js/utils/dialog.js"></script>

    <!-- 应用脚本 -->
    <script src="js/app.js"></script>
  </body>
</html>
